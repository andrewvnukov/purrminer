<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- TITLE: держи <title> РОВНО равным названию в консоли (урок модерации п.5.1.3) -->
<title>Котокопы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<!-- Yandex SDK: грузим только внутри iframe площадки. Вне неё (локальный просмотр,
     smoke-тест) реальный SDK шлёт postMessage родителю и падает с ошибками в консоль,
     даже если просто загрузить скрипт — поэтому вне iframe не грузим его вовсе
     и сразу уходим в localStorage-фолбэк (onerror страхует на случай сетевых сбоев). -->
<script>
  window.__inIframe = true;
  try{ window.__inIframe = window.top !== window.self; }catch(e){ window.__inIframe = true; }
  if(!window.__inIframe){ window.__noSDK = true; }
  else {
    var __sdkS = document.createElement('script');
    __sdkS.src = 'https://yandex.ru/games/sdk/v2';
    __sdkS.onerror = function(){ window.__noSDK = true; if(window.__onSdkScriptDone) window.__onSdkScriptDone(); };
    __sdkS.onload  = function(){ if(window.__onSdkScriptDone) window.__onSdkScriptDone(); };
    document.head.appendChild(__sdkS);
  }
</script>
<style>
  :root{
    /* ── Токены стиля: тема «шахта» (тёплая охра/земля вместо луговой зелени) ── */
    --ink:#4A3527; --ink-soft:#8C7360; --line:#5A4030;
    --paper:#FFF3DD;
    --accent:#F2B341; --accent-deep:#D89426;
    --gold:#FFD166; --mint:#7FBF8B; --lav:#8F8FE3;
    --bg:#7A6650;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);position:fixed;inset:0;background:var(--bg)}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;
       padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
       max-width:520px;margin:0 auto}
  .top{display:flex;gap:8px;align-items:flex-start}
  .chip{background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:6px 12px;
        display:flex;flex-direction:column;gap:1px;box-shadow:0 3px 0 rgba(74,53,39,.35)}
  .chip .v{font-weight:900;font-size:17px;line-height:1;white-space:nowrap}
  .chip .l{font-size:10px;font-weight:800;color:var(--ink-soft);letter-spacing:.3px}
  .spacer{flex:1}
  .giftbtn{pointer-events:auto;background:var(--gold);border:2.5px solid var(--line);border-radius:50%;
        width:44px;height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:20px;
        cursor:pointer;box-shadow:0 3px 0 rgba(74,53,39,.35);transition:transform .08s,box-shadow .08s}
  .giftbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(74,53,39,.35)}
  .bottom{display:flex;gap:10px;pointer-events:auto}
  .abtn{flex:1;background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:12px;
        font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 3px 0 rgba(74,53,39,.35);
        transition:transform .08s,box-shadow .08s;color:var(--ink)}
  .abtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(74,53,39,.35)}
  .abtn.main{background:var(--accent);color:#fff;border-color:var(--accent-deep)}
  #toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
         background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:9px 16px;border-radius:99px;
         opacity:0;transition:.25s;pointer-events:none;max-width:80vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body oncontextmenu="return false">
<canvas id="cv"></canvas>
<div id="hud">
  <div class="top">
    <div class="chip"><span class="v" id="coinsV">0</span><span class="l" id="coinsL">МОНЕТЫ</span></div>
    <div class="chip"><span class="v" id="ipsV">0/с</span><span class="l" id="ipsL">ДОХОД</span></div>
    <div class="chip"><span class="v" id="depthV">—</span><span class="l" id="depthL">ГЛУБИНА</span></div>
    <div class="spacer"></div>
    <button class="giftbtn" id="giftBtn" style="display:none" title="Ежедневный подарок">🎁</button>
  </div>
  <div class="spacer"></div>
  <div class="bottom">
    <button class="abtn main" id="tapBtn">Копать ⛏</button>
    <button class="abtn" id="upBtn">Улучшить</button>
  </div>
</div>
<div id="toast"></div>
<script>
'use strict';
// ============================================================
//  Котокопы / Purrminer — idle/tycoon про кота-шахтёра
//  Петля: тап киркой -> руда и монеты сразу -> руда копится в
//  вагонетке -> полная вагонетка даёт бонус и открывает глубину
//  -> апгрейд кирки сильнее бьёт, каждый 3-й найм помощника
//  добавляет пассивный доход -> глубже шахта -> дороже руда.
// ============================================================
const SAVE_KEY = "purrminer_save_v1";       // GAME: уникальный ключ сейва на игру
const LB_NAME  = "purrminer_lifetime_coins"; // техимя лидерборда в консоли
let ysdk=null, player=null, lb=null, saveT=0, booted=false;

// ---------- i18n (авто-язык через SDK, урок модерации п.2.14) ----------
function lang(){
  try{ if(ysdk&&ysdk.environment&&ysdk.environment.i18n&&ysdk.environment.i18n.lang)
    return ysdk.environment.i18n.lang==="ru"?"ru":"en"; }catch(e){}
  return (navigator.language||"ru").slice(0,2)==="ru"?"ru":"en";
}
const STR = {
  coins:{ru:"МОНЕТЫ",en:"COINS"}, income:{ru:"ДОХОД",en:"INCOME"},
  depthL:{ru:"ГЛУБИНА",en:"DEPTH"},
  action:{ru:"Копать ⛏",en:"Dig ⛏"},
  upgrade:{ru:"Улучшить",en:"Upgrade"},
  need:{ru:"Не хватает монет",en:"Not enough coins"},
  upgraded:{ru:"⛏ Кирка улучшена!",en:"⛏ Pickaxe upgraded!"},
  helperJoined:{ru:"🐾 Кот-помощник присоединился!",en:"🐾 A helper cat joined!"},
  newDepth:{ru:"Новая глубина открыта: ",en:"New depth unlocked: "},
  cartFull:{ru:"🛒 Вагонетка разгружена! +",en:"🛒 Cart delivered! +"},
  giftReady:{ru:"🎁 Загляни за подарком!",en:"🎁 Daily gift is ready!"},
};
const T = k => (STR[k]||{})[lang()] || (STR[k]||{}).ru || k;

// GAME: 6 ярусов шахты — тема/руда/цена/цвет забоя, разблокируются по lifetime-доходу
const DEPTHS = [
  { name:{ru:"Погреб",   en:"Cellar"},       ore:{ru:"Камешки",  en:"Pebbles"},  emoji:"🪨", value:1,   bg:"#9C8768", thr:0 },
  { name:{ru:"Штольня",  en:"Tunnel"},       ore:{ru:"Медь",     en:"Copper"},   emoji:"🟤", value:3,   bg:"#8A6A4E", thr:300 },
  { name:{ru:"Пещера",   en:"Cavern"},       ore:{ru:"Серебро",  en:"Silver"},   emoji:"⚪", value:8,   bg:"#6B5646", thr:1200 },
  { name:{ru:"Разлом",   en:"Rift"},         ore:{ru:"Золото",   en:"Gold"},     emoji:"🟡", value:20,  bg:"#4F3F34", thr:4000 },
  { name:{ru:"Кристальный зал", en:"Crystal Hall"}, ore:{ru:"Изумруд", en:"Emerald"}, emoji:"🟢", value:50, bg:"#3A2F28", thr:12000 },
  { name:{ru:"Бездна",   en:"Abyss"},        ore:{ru:"Сапфир",   en:"Sapphire"}, emoji:"🔵", value:120, bg:"#241D19", thr:30000 },
];

// ---------- Состояние ----------
function fresh(){
  return {
    v:1,
    coins:0,          // GAME: текущие монеты
    lifetime:0,       // GAME: монет заработано за всю игру (гейт глубины)
    ore:0,            // GAME: руда в текущей вагонетке
    pickLvl:1,        // GAME: уровень кирки (сила удара)
    liftLvl:0,         // GAME: число помощников (пассивная добыча)
    depth:0,          // GAME: последняя показанная глубина (для тоста открытия)
    gems:[0,0,0,0,0,0], // GAME: коллекция — сколько вагонеток каждой руды сдано
    lastGiftDay:"",    // GAME: дата последнего ежедневного подарка
    time:Date.now()
  };
}
let S = fresh();

// ---------- Экономика ----------
// GAME: формулы шахты
function depthIndex(){
  let idx=0;
  for(let i=DEPTHS.length-1;i>=0;i--){ if(S.lifetime>=DEPTHS[i].thr){ idx=i; break; } }
  return idx;
}
const curDepth   = () => DEPTHS[depthIndex()];
const oreValue   = () => curDepth().value;
const cartCap    = () => 20 + depthIndex()*12;
const tapGain    = () => S.pickLvl;                          // руды за удар
const liftRate   = () => S.liftLvl*0.5;                      // руды/сек от помощников
const ips        = () => Math.round(liftRate()*oreValue()*10)/10; // монет/сек для HUD
const upCost     = () => Math.floor(15*Math.pow(1.45,S.pickLvl-1));

// ---------- Сейвы (throttle + облако Яндекса, фолбэк на localStorage) ----------
function persist(force){
  const now=Date.now();
  if(!force && now-saveT<10000) return;
  saveT=now;
  const raw=JSON.stringify(S);
  try{ localStorage.setItem(SAVE_KEY,raw); }catch(e){}
  if(player){ try{ player.setData({save:raw}); }catch(e){} }
}
function restore(raw){
  if(!raw) return;
  try{ const d=(typeof raw==="string")?JSON.parse(raw):(raw.save?JSON.parse(raw.save):raw);
       if(d&&typeof d==="object") S=Object.assign(fresh(),d); }catch(e){}
}

// ---------- Реклама (no-op вне платформы; награда всегда выдаётся) ----------
let lastAd=0;
function maybeInterstitial(){
  if(!ysdk) return;
  if(Date.now()-lastAd < 180000) return;             // не чаще раза в 3 мин
  lastAd=Date.now();
  try{ ysdk.adv.showFullscreenAdv({}); }catch(e){}
}
function showRewarded(onReward){
  if(!ysdk){ onReward(); return; }
  try{ ysdk.adv.showRewardedVideo({callbacks:{ onRewarded:onReward, onError:onReward, onClose:()=>{} }}); }
  catch(e){ onReward(); }
}

// ---------- Лидерборд (тихо no-op, если не настроен) ----------
function submitScore(v){
  try{ if(lb&&LB_NAME) lb.setLeaderboardScore(LB_NAME, Math.floor(v)); }catch(e){}
}

// ---------- Ежедневный подарок (крючок возврата) ----------
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function giftAvailable(){ return S.lastGiftDay!==todayStr(); }
function claimGift(){
  if(!giftAvailable()) return;
  const bonus=Math.max(30, Math.floor(upCost()*0.6));
  S.coins+=bonus; S.lifetime+=bonus; S.lastGiftDay=todayStr();
  toast("🎁 +"+fmt(bonus));
  refreshHud(); persist(true); checkDepthUp();
}

// ---------- HUD ----------
const $ = id => document.getElementById(id);
const fmt = n => n>=1e6 ? (n/1e6).toFixed(1)+"M" : n>=1e3 ? (n/1e3).toFixed(1)+"K" : Math.floor(n).toString();
function refreshHud(){
  $("coinsV").textContent = fmt(S.coins);
  $("ipsV").textContent   = fmt(ips())+"/"+(lang()==="ru"?"с":"s");
  $("coinsL").textContent = T("coins");
  $("ipsL").textContent   = T("income");
  $("depthV").textContent = curDepth().name[lang()];
  $("depthL").textContent = T("depthL");
  $("tapBtn").textContent = T("action");
  $("upBtn").textContent  = T("upgrade")+" ("+fmt(upCost())+")";
  $("giftBtn").style.display = giftAvailable() ? "flex" : "none";
}
let toastT;
function toast(msg){ const el=$("toast"); el.textContent=msg; el.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),1600); }

// ---------- Глубина: открытие нового яруса ----------
function checkDepthUp(){
  const d=depthIndex();
  if(d>S.depth){ S.depth=d; toast("⛏ "+T("newDepth")+curDepth().name[lang()]+"!"); }
}

// ---------- Вагонетка: сдать руду, получить бонус ----------
function deliverCart(){
  const cap=cartCap(), val=oreValue();
  const bonus=Math.floor(cap*val*0.6);
  S.coins+=bonus; S.lifetime+=bonus;
  S.gems[depthIndex()] = (S.gems[depthIndex()]||0)+1;
  S.ore-=cap; if(S.ore<0) S.ore=0;
  toast(T("cartFull")+fmt(bonus));
  checkDepthUp();
}

// ---------- Действия ----------
let punch=0; // GAME: анимация «удара» кирки (0..1, гасится в frame)
function doTap(){
  const g=tapGain();
  const gain=g*oreValue();
  S.coins+=gain; S.lifetime+=gain; S.ore+=g;
  punch=1; spawnOreParticle();
  if(S.ore>=cartCap()) deliverCart();
  refreshHud(); persist();
}
function doUpgrade(){
  const c=upCost();
  if(S.coins<c){ toast(T("need")); return; }
  S.coins-=c; S.pickLvl++;
  let msg=T("upgraded");
  if(S.pickLvl%3===0){ S.liftLvl++; msg=T("helperJoined"); }
  refreshHud(); persist(true); submitScore(S.lifetime); maybeInterstitial(); checkDepthUp();
  toast(msg);
}

// ---------- Canvas: отрисовка мира шахты ----------
const cv=$("cv"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener("resize",resize);

function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function roundRectPath(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }

// GAME: слой руды летит от кота к вагонетке — чисто декоративная частица
let particles=[]; let lastLayout=null;
function spawnOreParticle(){
  if(!lastLayout) return;
  particles.push({ x0:lastLayout.catX, y0:lastLayout.catY, x1:lastLayout.cartX, y1:lastLayout.cartY,
    t0:performance.now(), dur:550, emoji:curDepth().emoji });
}
function drawParticles(now){
  particles=particles.filter(p=>{
    const t=(now-p.t0)/p.dur;
    if(t>=1) return false;
    const x=p.x0+(p.x1-p.x0)*t, y=p.y0+(p.y1-p.y0)*t - Math.sin(t*Math.PI)*36;
    ctx.globalAlpha=1-t*0.7;
    ctx.font="22px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(p.emoji,x,y);
    ctx.globalAlpha=1;
    return true;
  });
}

function drawScene(){
  const d=curDepth();
  const colW=Math.min(W,560), colX=(W-colW)/2;

  // фон-градиент по текущей глубине
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, d.bg); g.addColorStop(1, "#000000");
  ctx.save(); ctx.globalAlpha=1; ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.restore();
  ctx.fillStyle="rgba(0,0,0,.22)";
  ctx.fillRect(0,0,colX,H); ctx.fillRect(colX+colW,0,W-colX-colW,H);

  // туннельная арка позади кота
  ctx.fillStyle="rgba(0,0,0,.20)";
  ctx.beginPath(); ctx.ellipse(colX+colW/2, H*0.62, colW*0.42, H*0.30, 0,0,Math.PI*2); ctx.fill();
  // пол забоя
  ctx.strokeStyle="rgba(0,0,0,.3)"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(colX+colW*0.08,H*0.80); ctx.lineTo(colX+colW*0.92,H*0.80); ctx.stroke();

  // вагонетка
  const cw=colW*0.5, ch=Math.min(colW*0.22, H*0.10);
  const cx=colX+(colW-cw)/2, cy=H*0.20;
  ctx.lineWidth=4; ctx.strokeStyle=cssVar("--line"); ctx.fillStyle=cssVar("--paper");
  roundRectPath(cx,cy,cw,ch,16); ctx.fill(); ctx.stroke();
  const pad=7, pct=Math.min(1,S.ore/cartCap());
  ctx.fillStyle="rgba(0,0,0,.18)"; roundRectPath(cx+pad,cy+pad,cw-2*pad,ch-2*pad,10); ctx.fill();
  ctx.fillStyle=cssVar("--accent");
  ctx.save(); roundRectPath(cx+pad,cy+pad,(cw-2*pad)*pct,ch-2*pad,10); ctx.clip(); ctx.fillRect(cx+pad,cy+pad,cw-2*pad,ch-2*pad); ctx.restore();
  ctx.fillStyle=cssVar("--ink");
  ctx.beginPath(); ctx.arc(cx+cw*0.22,cy+ch+9,8,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+cw*0.78,cy+ch+9,8,0,Math.PI*2); ctx.fill();
  ctx.font="26px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="#fff"; ctx.fillText(d.emoji+" "+Math.floor(S.ore)+"/"+cartCap(), cx+cw/2, cy+ch/2);

  // кот-шахтёр + кирка
  const catX=colX+colW*0.42, catY=H*0.66;
  const size=colW*0.30*(1+punch*0.14);
  ctx.save(); ctx.translate(catX,catY); ctx.rotate(-punch*0.10);
  ctx.font=size+"px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("🐱",0,0);
  ctx.restore();
  ctx.save(); ctx.translate(catX+size*0.34, catY-size*0.12); ctx.rotate(0.55-punch*1.0);
  ctx.font=(size*0.55)+"px sans-serif"; ctx.fillText("⛏️",0,0);
  ctx.restore();

  // помощники (пассивная добыча) — маленькие коты сбоку
  for(let i=0;i<Math.min(S.liftLvl,4);i++){
    const hx=colX+colW*(0.14+i*0.10), hy=H*0.74;
    ctx.font=(colW*0.10)+"px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("🐈",hx,hy);
  }

  lastLayout={ catX, catY, cartX:cx+cw/2, cartY:cy+ch/2 };

  // коллекция руд снизу
  const n=DEPTHS.length, stripW=colW*0.94, sx=colX+(colW-stripW)/2, sy=H*0.92, cellW=stripW/n;
  for(let i=0;i<n;i++){
    const gx=sx+cellW*i+cellW/2;
    const discovered=i<=depthIndex();
    ctx.font="18px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(discovered?DEPTHS[i].emoji:"🔒", gx, sy);
    ctx.font="800 11px Nunito, sans-serif"; ctx.fillStyle="rgba(255,255,255,.85)";
    ctx.fillText(discovered?String(S.gems[i]||0):"", gx, sy+15);
  }
}

let lastT=performance.now(), acc=0;
function frame(now){
  let dt=Math.max(0,(now-lastT)/1000); lastT=now;
  acc+=dt;
  if(acc>=1){ // GAME: пассивная добыча помощников раз в секунду
    const t=Math.floor(acc); acc-=t;
    if(S.liftLvl>0){
      const oreGain=liftRate()*t, coinsGain=oreGain*oreValue();
      S.coins+=coinsGain; S.lifetime+=coinsGain; S.ore+=oreGain;
      if(S.ore>=cartCap()) deliverCart();
      refreshHud(); persist();
    }
  }
  punch=Math.max(0,punch-dt*3.2);
  drawScene();
  drawParticles(now);
  requestAnimationFrame(frame);
}

// ---------- Тест-хуки (для Playwright smoke-теста) ----------
window.render_game_to_text = () => JSON.stringify({
  coins:S.coins, lvl:S.pickLvl, ips:ips(), upCost:upCost(),
  depth:depthIndex(), ore:S.ore, lifetime:S.lifetime
});
window.advanceTime = ms => { S.coins += ips()*(ms/1000); refreshHud(); };

// ---------- Boot ----------
function boot(raw){
  if(booted) return; booted=true;
  restore(raw);
  resize(); refreshHud();
  $("tapBtn").onclick=doTap;
  $("upBtn").onclick=doUpgrade;
  $("giftBtn").onclick=claimGift;
  if(giftAvailable()) setTimeout(()=>{ if(giftAvailable()) toast(T("giftReady")); },1200);
  requestAnimationFrame(frame);
}
(function initSDK(){
  let localRaw=null; try{ localRaw=localStorage.getItem(SAVE_KEY); }catch(e){}
  function start(){
    if(window.YaGames && !window.__noSDK){
      YaGames.init().then(sdk=>{
        ysdk=sdk;
        try{ sdk.features.LoadingAPI && sdk.features.LoadingAPI.ready(); }catch(e){}
        const pReady = sdk.getPlayer({scopes:false}).then(p=>{player=p;return p.getData(["save"]);})
          .then(d=>boot(d&&d.save?d.save:localRaw)).catch(()=>boot(localRaw));
        try{ lb = sdk.leaderboards; }catch(e){}
        return pReady;
      }).catch(()=>boot(localRaw));
      setTimeout(()=>boot(localRaw),4000);      // страховочный таймаут
    } else boot(localRaw);
  }
  // GAME: скрипт SDK грузится асинхронно (см. <head>) только внутри iframe;
  // ждём его onload/onerror, а вне iframe __noSDK уже выставлен синхронно — стартуем сразу.
  if(window.__noSDK || window.YaGames) start();
  else window.__onSdkScriptDone = start;
})();
</script>
</body>
</html>
